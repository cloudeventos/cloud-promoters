<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Promoters - Gestão de Divulgadores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0ea5e9; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cloud Promoters 🚀</h1>
        <h2>Cadastro de Divulgadores (Cloud Eventos)</h2>
        
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="instagram">Instagram (@):</label>
            <input type="text" id="instagram" placeholder="@seuinstagram">
        </div>

        <button onclick="cadastrarPromoter()">Cadastrar na Nuvem</button>

        <p id="mensagem"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjuojuimexwtcjjyrskdv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqdW9qdWltZXh3dGNqeXJza2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NzMzNTIsImV4cCI6MjEwNTI0OTM1Mn0.6CN4DRxmc_E_-K2TUJwWxm10RnVGeXnQRTTIYrlBhqk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cadastrarPromoter() {
            const nome = document.getElementById('nome').value;
            const instagram = document.getElementById('instagram').value;
            const mensagem = document.getElementById('mensagem');

            if (!nome || !instagram) {
                mensagem.style.color = '#f87171';
                mensagem.innerText = 'Por favor, preencha todos os campos!';
                return;
            }

            mensagem.style.color = '#38bdf8';
            mensagem.innerText = 'Salvando na nuvem...';

            try {
                const { data, error } = await supabaseClient
                    .from('promoters')
                    .insert([{ nome: nome, instagram: instagram }]);

                if (error) {
                    throw error;
                }

                mensagem.style.color = '#4ade80';
                mensagem.innerText = 'Cadastro realizado com sucesso na nuvem! 🎉';
                document.getElementById('nome').value = '';
                document.getElementById('instagram').value = '';
            } catch (error) {
                mensagem.style.color = '#f87171';
                mensagem.innerText = 'Erro: ' + (error.message || JSON.stringify(error));
            }
        }
    </script>
</body>
</html>
